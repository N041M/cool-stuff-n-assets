<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Globe</title>
  <link rel="preload" href="fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="globe.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      font: 11px/1.3 var(--mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .bar .name { margin-right: auto; color: var(--fg); }
    .bar .back { margin-right: 8px; color: inherit; text-decoration: none; }
    .bar .back:hover { color: var(--fg); }
    main { width: 100%; max-width: 620px; margin: 0 auto; padding: 48px 16px; }
  </style>
  <script defer src="globe.js"></script>
</head>
<body>
  <header class="bar">
    <a class="back" href="../">← All demos</a>
    <span class="name">Globe</span>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-set-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-set-lang="cs" aria-pressed="false">CZ</button>
    </div>
    <div class="seg" role="group" aria-label="Theme">
      <button type="button" data-set-theme="light" aria-pressed="false">Light</button>
      <button type="button" data-set-theme="dark" aria-pressed="false">Dark</button>
      <button type="button" data-set-theme="system" aria-pressed="true">Auto</button>
    </div>
  </header>

  <main>
    <figure class="fig globe-fig">
      <pre class="plot" data-figure="globe" data-world="data/world" aria-hidden="true"></pre>
      <div class="seg globe-zoom" role="group" aria-label="Globe">
        <button type="button" data-globe="in" aria-label="Zoom in" title="Zoom in">+</button>
        <button type="button" data-globe="out" aria-label="Zoom out" title="Zoom out">-</button>
        <button type="button" data-globe="home" aria-label="Show Jablonec nad Nisou" title="Show Jablonec nad Nisou">JBC</button>
      </div>
    </figure>
  </main>

  <script>
    // Language and theme switches for trying the globe. The globe reads the
    // language from <html lang> and redraws on a "langchange" event.
    (function () {
      var root = document.documentElement;
      function press(attr, value) {
        document.querySelectorAll("[" + attr + "]").forEach(function (b) {
          b.setAttribute("aria-pressed", String(b.getAttribute(attr) === value));
        });
      }
      document.querySelectorAll("[data-set-lang]").forEach(function (b) {
        b.addEventListener("click", function () {
          root.lang = b.getAttribute("data-set-lang");
          press("data-set-lang", root.lang);
          document.dispatchEvent(new CustomEvent("langchange", { detail: root.lang }));
        });
      });
      document.querySelectorAll("[data-set-theme]").forEach(function (b) {
        b.addEventListener("click", function () {
          var choice = b.getAttribute("data-set-theme");
          if (choice === "system") root.removeAttribute("data-theme");
          else root.setAttribute("data-theme", choice);
          press("data-set-theme", choice);
        });
      });
    })();
  </script>
</body>
</html>
