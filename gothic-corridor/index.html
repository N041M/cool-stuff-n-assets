<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gothic corridor</title>
  <link rel="preload" href="fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Departure Mono";
      src: url("fonts/DepartureMono-Regular.woff2") format("woff2");
      font-display: swap;
    }
    :root {
      --bg: #090606;
      --accent: #ff5a43;
      --ink: #e8e1d9;
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body { font: 400 15px/1.5 "Departure Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    /* preview.webp is one frame of this scene. It shows while the scene
       bakes, and it stays when the scene cannot run on the device. */
    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--bg) url("preview.webp") 70% 50% / cover no-repeat;
    }
    .backdrop__canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.9s ease;
    }
    .scene.is-ready .backdrop__canvas { opacity: 1; }
    .back {
      position: fixed;
      top: 16px;
      left: 16px;
      padding: 8px 12px;
      background: rgb(9 6 6 / 0.72);
      color: var(--ink);
      text-decoration: none;
    }
    .back:hover { color: var(--accent); }
    .still-note {
      display: none;
      position: fixed;
      right: 16px;
      bottom: 16px;
      margin: 0;
      padding: 4px 10px;
      background: rgb(9 6 6 / 0.72);
      font-size: 13px;
    }
    .scene.is-still ~ .still-note { display: block; }
  </style>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <a class="back" href="../">← All demos</a>
  <p class="still-note">Still image</p>
</body>
</html>
