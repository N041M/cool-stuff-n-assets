<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel drive</title>
  <link rel="preload" href="fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="demo.css">
  <script defer src="js/core.js"></script>
  <script defer src="js/art-nature.js"></script>
  <script defer src="js/art-built.js"></script>
  <script defer src="js/art-beings.js"></script>
  <script defer src="js/world.js"></script>
  <script defer src="js/weather.js"></script>
  <script defer src="js/scenes.js"></script>
  <script defer src="js/ascii.js"></script>
  <script defer src="js/engine.js"></script>
  <script defer src="demo.js"></script>
</head>
<body>
  <canvas id="drive" aria-hidden="true"></canvas>

  <header class="top">
    <div class="bar">
      <a class="back" href="../" aria-label="All demos">← <span>All demos</span></a>
      <h1 class="brand">Pixel drive</h1>
      <div class="seg" role="group" aria-label="Look">
        <button type="button" data-set-style="pixel" aria-pressed="true">Pixel</button>
        <button type="button" data-set-style="ascii" aria-pressed="false">ASCII</button>
      </div>
      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-set-theme="light" aria-pressed="false">Light</button>
        <button type="button" data-set-theme="dark" aria-pressed="false">Dark</button>
        <button type="button" data-set-theme="system" aria-pressed="true">Auto</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" data-hero>
      <div class="hero-inner">
        <form class="panel" data-jump>
          <div class="panel-head">
            <span class="label speed-label">Speed</span>
            <div class="seg speed" role="group" aria-label="Speed">
              <button type="button" data-set-rate="1" aria-pressed="true">1×</button>
              <button type="button" data-set-rate="2" aria-pressed="false">2×</button>
              <button type="button" data-set-rate="4" aria-pressed="false">4×</button>
              <button type="button" data-set-rate="8" aria-pressed="false">8×</button>
            </div>
            <button type="button" class="btn btn-small" data-hop>Hop</button>
            <button type="button" class="btn btn-small" data-toggle-setup aria-expanded="true" aria-controls="setup">Hide setup</button>
          </div>
          <div class="setup" id="setup">
          <div class="fields">
            <label>
              <span class="label">Place</span>
              <select name="place">
                <option value="">Any</option>
                <option value="city">City</option>
                <option value="highway">Highway</option>
                <option value="bridge">Bridge</option>
                <option value="shore">Coast</option>
                <option value="desert">Desert</option>
                <option value="rally">Rally stage</option>
                <option value="country">Farmland</option>
                <option value="village">Village</option>
                <option value="forest">Forest</option>
                <option value="mountains">Mountain pass</option>
                <option value="winter">Winter valley</option>
              </select>
            </label>
            <label>
              <span class="label">Time</span>
              <select name="hour">
                <option value="">Now</option>
                <option value="6">06:00</option>
                <option value="9">09:00</option>
                <option value="12">12:00</option>
                <option value="16">16:00</option>
                <option value="19.5">19:30</option>
                <option value="23">23:00</option>
              </select>
            </label>
            <label>
              <span class="label">Weather</span>
              <select name="weather">
                <option value="">Changing</option>
                <option value="clear">Clear</option>
                <option value="cloudy">Cloudy</option>
                <option value="rain">Rain</option>
                <option value="snow">Snow</option>
                <option value="fog">Fog</option>
              </select>
            </label>
            <button type="submit" class="btn btn-solid">Go</button>
          </div>
          <div class="scenes">
            <span class="label">Scenes</span>
            <button type="button" class="btn" data-scene="pitch">Football pitch</button>
            <button type="button" class="btn" data-scene="jested">Ještěd</button>
            <button type="button" class="btn" data-scene="ufo">UFO</button>
          </div>
          <p class="status">
            <span class="label">Seed <span data-seed>–</span></span>
            <a class="label" href="?" data-link>Link</a>
            <button type="button" class="btn btn-small" data-new>New route</button>
          </p>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
