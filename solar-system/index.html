<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Solar system</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23050608'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f0a14a'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='4' fill='none' stroke='%23eceae4' stroke-width='1.5' transform='rotate(-20 16 16)'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/ibm-plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="demo.css">
  <script defer src="js/ephemeris.js"></script>
  <script defer src="js/earth-map.js"></script>
  <script defer src="js/surfaces.js"></script>
  <script defer src="js/bodies.js"></script>
  <script defer src="js/orrery.js"></script>
  <script defer src="demo.js"></script>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <canvas id="hud" aria-hidden="true"></canvas>
  <div class="stage" id="stage" tabindex="0" role="application" aria-label="Solar system view" aria-describedby="keys"></div>
  <p class="sr-only" id="keys">The arrow keys turn and zoom. Keys 0 to 8 fly to the Sun and the planets, M to the Moon, and Home shows the whole system.</p>
  <p class="sr-only" id="said" aria-live="polite"></p>

  <header class="top" id="top">
    <a class="back" href="../" aria-label="All demos">← <span>All demos</span></a>
    <h1 class="brand">Solar system</h1>
    <p class="clock" aria-live="off"><span id="date">----------</span> <span id="rate">Live</span></p>
  </header>

  <nav class="panel bodies" id="bodies" aria-label="Bodies" hidden></nav>

  <section class="panel info" id="info" aria-labelledby="info-name">
    <p class="info-name" id="info-name">Saturn</p>
    <button type="button" class="info-close" id="info-close" aria-label="Close" title="Close">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
    <dl class="rows" id="info-rows"></dl>
    <p class="note" id="info-note" hidden></p>
    <button type="button" class="link" id="info-back" hidden></button>
  </section>

  <div class="controls" id="controls">
    <div class="group panels" role="group" aria-label="Panels">
      <button type="button" class="text" id="open-bodies" aria-expanded="false" aria-controls="bodies">Bodies</button>
      <button type="button" class="text" id="open-info" aria-expanded="true" aria-controls="info">Info</button>
    </div>
    <div class="group view" role="group" aria-label="View">
      <button type="button" data-zoom="1" aria-label="Zoom out" title="Zoom out">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg>
      </button>
      <button type="button" data-zoom="-1" aria-label="Zoom in" title="Zoom in">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg>
      </button>
      <button type="button" data-turn="-1" aria-label="Turn left" title="Turn left">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12.5 10.5A5 5 0 1 0 6 12.6"/><path d="M3 10.2l3 2.4-2.6 2.6"/></svg>
      </button>
      <button type="button" data-turn="1" aria-label="Turn right" title="Turn right">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 10.5A5 5 0 1 1 10 12.6"/><path d="M13 10.2l-3 2.4 2.6 2.6"/></svg>
      </button>
      <button type="button" data-tilt="-1" aria-label="Tilt up" title="Tilt up">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M4 7l4-4 4 4"/></svg>
      </button>
      <button type="button" data-tilt="1" aria-label="Tilt down" title="Tilt down">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M4 9l4 4 4-4"/></svg>
      </button>
    </div>
    <div class="group time" role="group" aria-label="Time">
      <button type="button" data-warp="-1" aria-label="Slower or backwards" title="Slower or backwards">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path class="fill" d="M8 4v8L3 8zM13 4v8L8 8z"/></svg>
      </button>
      <button type="button" id="pause" aria-label="Pause" title="Pause">
        <svg class="if-playing" viewBox="0 0 16 16" aria-hidden="true"><path class="fill" d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>
        <svg class="if-paused" viewBox="0 0 16 16" aria-hidden="true"><path class="fill" d="M5 3l8 5-8 5z"/></svg>
      </button>
      <button type="button" data-warp="1" aria-label="Faster" title="Faster">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path class="fill" d="M3 4v8l5-4zM8 4v8l5-4z"/></svg>
      </button>
      <button type="button" class="text" id="now">Now</button>
    </div>
  </div>
</body>
</html>
